[tools]
python = "3.12"
bun = "1.4.2"
node = "24"

[tasks.lint]
description = "Validate directory structure, YAML schema, and Markdown rules"
run = [
  "python -m pip install -r requirements.txt",
  "python scripts/validate_repo.py"
]

[tasks.build-db]
description = "Compile YAML+MD to SQLite, run JS client build/test, copy schemas to dist/"
run = [
  "python -m pip install -r requirements.txt",
  "python scripts/validate_repo.py",
  "python -m unittest discover -s scripts -p 'test_*.py'",
  "mise run client-build",
  "python scripts/build_db.py",
  "mise run client-test"
]

[tasks.client-build]
description = "Bundle the official SQLite WASM client and pack the distribution"
dir = "js-client"
run = [
  "bun install",
  "bun run build",
  "bun run pack"
]

[tasks.client-test]
description = "Execute vitest suite for the JS client"
dir = "js-client"
run = [
  "bun install",
  "bun run test"
]
