name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a content-only release and notify downstream consumers
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      # Pull requests must exercise publication regressions and the actual
      # packaged SQLite client as well as schema validation.
      - run: mise run build-db

  build-release-deploy:
    permissions:
      contents: write
      deployments: write
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache: false
      - name: Build DB + JS client
        run: mise run build-db
      - name: Compute checksums
        id: checksum
        run: |
          cd dist
          shasum -a 256 manabi-grammar.sqlite grammar-table-row.schema.json grammar-yaml.schema.json reference-registry.schema.json reference-registry.json manabi-grammar-db-client.zip > checksums.txt
          {
            echo "Checksums (SHA-256):"
            echo '```'
            cat checksums.txt
            echo '```'
          } > release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: db-${{ github.sha }}
          name: Grammar DB ${{ github.sha }}
          body_path: dist/release-notes.md
          files: |
            dist/manabi-grammar.sqlite
            dist/grammar-table-row.schema.json
            dist/grammar-yaml.schema.json
            dist/reference-registry.schema.json
            dist/reference-registry.json
            dist/manabi-grammar-db-client.zip
            dist/checksums.txt
      - name: Get release asset URLs
        id: rel
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: `db-${context.sha}`,
            });
            const asset = name => release.assets.find(a => a.name === name);
            const dbAsset = asset('manabi-grammar.sqlite');
            const clientAsset = asset('manabi-grammar-db-client.zip');
            const yamlSchema = asset('grammar-yaml.schema.json');
            const tableSchema = asset('grammar-table-row.schema.json');
            const checksums = asset('checksums.txt');
            const referenceRegistry = asset('reference-registry.json');
            const referenceSchema = asset('reference-registry.schema.json');
            if (!dbAsset || !clientAsset || !yamlSchema || !tableSchema || !checksums || !referenceRegistry || !referenceSchema) {
              core.setFailed('Missing expected release assets.');
            } else {
              core.setOutput('db_url', dbAsset.browser_download_url);
              core.setOutput('checksums_url', checksums.browser_download_url);
              core.setOutput('client_url', clientAsset.browser_download_url);
              core.setOutput('yaml_schema_url', yamlSchema.browser_download_url);
              core.setOutput('table_schema_url', tableSchema.browser_download_url);
            }
      - name: Create Deployment
        id: dep
        uses: chrnorm/deployment-action@500aa6a23c81ffa1acf71072aee3cfa2cc2e556a # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: grammar-db
          ref: ${{ github.ref }}
      - name: Set Deployment Status
        uses: chrnorm/deployment-status@6df8d036fd2fee9eb82936733953da1f8382b41e # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.dep.outputs.deployment_id }}
          state: success
          environment-url: ${{ steps.rel.outputs.db_url }}
          log-url: ${{ steps.rel.outputs.client_url }}
          description: db-${{ github.sha }}
      - name: repository_dispatch to web repo
        uses: peter-evans/repository-dispatch@5fc4efd1a4797ddb68ffd0714a238564e4cc0e6f
        with:
          token: ${{ secrets.WEB_REPO_TOKEN }}
          repository: ManabiIO/manabi-grammar-web
          event-type: grammar-db-deployed
          client-payload: |
            {
              "db_url": "${{ steps.rel.outputs.db_url }}",
              "client_url": "${{ steps.rel.outputs.client_url }}",
              "checksums_url": "${{ steps.rel.outputs.checksums_url }}",
              "yaml_schema_url": "${{ steps.rel.outputs.yaml_schema_url }}",
              "table_schema_url": "${{ steps.rel.outputs.table_schema_url }}",
              "release_tag": "db-${{ github.sha }}"
            }
