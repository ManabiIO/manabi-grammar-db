ruleID: grammar.ja.source.takoboto.1725
ruleVersion: 10
examples: []
exampleSentences:
- sentence: 音を立てないように歩く。
- sentence: 忘れないようにメモする。
- sentence: 音が出ないよう、静かに歩く。
- sentence: 忘れないようにする。
- sentence: 彼が働かないようにする。
- sentence: 滑らないように、歩く。
- sentence: 忘れないようにノートに書く。
- sentence: 滑らないように慎重に歩く。
- sentence: 音が出ないよう、窓を閉める。
- sentence: 滑らないよう、お店の床から小石を取り除く。
