ruleID: grammar.ja.source.takoboto.482
ruleVersion: 3
examples: []
exampleSentences:
- sentence: 実に楽しいものですね。
- sentence: 本当に美しいものだ。
- sentence: よく助かったものだ。
- sentence: あんな事故にあってよく生き残ったものだ。
- sentence: 子供のころはよく川で泳いだものだ。
- sentence: 若いころはよく旅をしたものです。
- sentence: 約束はきちんと守るものだ。
- sentence: 人の話はよく聞くものです。
- sentence: 学生のころ、友達と遊んで、よく先生に叱られたものです。
- sentence: 子供のころはよく父に叱られたものだ。
- sentence: 昔はよく祖母に褒められたものだ。
- sentence: かつて近所の人に助けられたものだ。
- sentence: 昔、よく図書館で本を読んだものだ。
- sentence: 約束をしたらちゃんと守るものです。
- sentence: 約束したら、ちゃんと守るものだった。
