ruleID: grammar.ja.nakerebanaranai.obligation
ruleVersion: 3
examples: []
exampleSentences:
- sentence: 明日までに返さなければならない。
  translations:
    en: I must return it by tomorrow.
- sentence: 明日までに返さなければなりません。
  translations:
    en: I must return it by tomorrow.
- sentence: ここで待たなければならない。
  translations:
    en: I must wait here.
