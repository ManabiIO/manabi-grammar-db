ruleID: grammar.ja.nakerebanaranai.obligation
ruleVersion: 12
examples: []
exampleSentences:
- sentence: 明日までに返さなければならない。
  translations:
    en: I must return it by tomorrow.
- sentence: 明日までに返さなければなりません。
  translations:
    en: I must return it by tomorrow.
- sentence: ここで待たなければならない。
  translations:
    en: I must wait here.
- sentence: 明日までに返さなくてはならなかった。
  translations:
    en: I had to return it by tomorrow.
- sentence: 安全設備がなくてはならない。
  translations:
    en: There must be safety equipment.
