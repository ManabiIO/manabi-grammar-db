ruleID: grammar.ja.teiru.aspect
ruleVersion: 4
examples: []
exampleSentences:
- sentence: 本を読んでいる。
  translations:
    en: I am reading a book.
- sentence: 鳥が飛んでいます。
  translations:
    en: A bird is flying.
- sentence: 窓が開いていた。
  translations:
    en: The window was open.
- sentence: 今日は働いていない。
  translations:
    en: I am not working today.
- sentence: 弟は食べてる。
  translations:
    en: My younger brother is eating.
- sentence: 妹は歌ってた。
  translations:
    en: My younger sister was singing.
- sentence: 今は走っていません。
  translations:
    en: I am not running now.
- sentence: 本を読んでいなかった。
  translations:
    en: I was not reading a book.
- sentence: 昨日は働いていませんでした。
  translations:
    en: I was not working yesterday.
- sentence: 本を読んでた。
  translations:
    en: I was reading a book.
- sentence: 本を読んで居る。
  translations:
    en: I am reading a book.
- sentence: 本を読んで無かった。
  translations:
    en: I was not reading a book.
- sentence: 本を読んでいたい。
  translations:
    en: I want to keep reading a book.
- sentence: 想像していなかった。
  translations:
    en: I had not imagined it.
