ruleID: grammar.ja.source.takoboto.1550
ruleVersion: 5
examples: []
exampleSentences:
- sentence: 昔はよく川で遊んだものだ。
- sentence: かつてはここから海が見えたものだ。
- sentence: 毎朝よく走ったものです。
- sentence: 日曜日にはいつも釣りに行ったものだ。
- sentence: 子供の頃はよく泣いたものだった。
- sentence: 子供のころはよく川で泳いだものだ。
- sentence: 若いころはよく旅をしたものです。
- sentence: 昔はよく歌ったものだ。
- sentence: 学生のころ、友達と遊んで、よく先生に叱られたものです。
- sentence: 子供のころはよく父に叱られたものだ。
- sentence: 昔はよく祖母に褒められたものだ。
- sentence: かつて近所の人に助けられたものだ。
- sentence: 昔、よく図書館で本を読んだものだ。
